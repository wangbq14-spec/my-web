# Production compose stack.
# REQUIRED: a root `.env` must exist (copy from `.env.example` and set strong
# MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD). It provides the ${MYSQL_*} / port
# substitutions and the `env_file:` entries below. `backend/.env` supplies the
# application secrets (LLM keys, JWT_SECRET_KEY, ...) and is gitignored.
# Migration runs once via the dedicated `migration` service; backend/worker
# wait for it (service_completed_successfully), so no concurrent migration.
services:
  mysql:
    image: mysql:8.4
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    # AOF-only persistence (fsync every second) into the redis-data volume.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migration:
    build: {context: ., dockerfile: Dockerfile.backend}
    env_file: [.env, backend/.env]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      mysql: {condition: service_healthy}
    restart: "no"
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    env_file: [.env, backend/.env]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
      RAG_UPLOAD_DIR: /app/data/uploads
    volumes: [rag-uploads:/app/data/uploads]
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on:
      mysql: {condition: service_healthy}
      migration: {condition: service_completed_successfully}
    healthcheck:
      # Readiness (MySQL + Redis), not just liveness, so `depends_on:
      # service_healthy` only releases the frontend once the API can serve.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: Dockerfile.backend}
    env_file: [.env, backend/.env]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
      RAG_UPLOAD_DIR: /app/data/uploads
    command: ["/app/.venv/bin/python", "-m", "app.worker"]
    volumes: [rag-uploads:/app/data/uploads]
    depends_on:
      redis: {condition: service_healthy}
      migration: {condition: service_completed_successfully}
    restart: unless-stopped
    deploy: {replicas: 1}
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args: {VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}}
    depends_on:
      backend: {condition: service_healthy}
    ports: ["${FRONTEND_PORT:-8080}:80"]
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
  rag-uploads:
