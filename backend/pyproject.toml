[project]
name = "my-web-backend"
version = "0.1.0"
description = "Enterprise-ready backend auth foundation for my-web"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "pymysql>=1.1,<2",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.18,<1",
    "httpx>=0.28,<1",
    "pypdf>=6.16.2",
    "rq>=2.11.0",
    "redis>=8.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "redis: requires a reachable Redis server",
]
