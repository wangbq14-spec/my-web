name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit/lint/build only. Playwright E2E (classroom specs) requires the
      # full classroom stack (backend :8011 + MySQL + Redis + worker + fixtures)
      # which is not provisioned here; it runs locally and on the deploy server.
      - name: Run unit tests, lint, and build
        run: npm run test && npm run lint && npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra test --frozen

      - name: Run backend tests
        working-directory: backend
        env:
          JWT_SECRET_KEY: test-only-secret-key-not-for-production
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          LLM_MODEL: test-default-model
          REDIS_URL: ""
          PYTHONUTF8: "1"
        # `python -m pytest` (rather than the `pytest` console script) keeps the
        # backend working directory on sys.path, matching the local dev run.
        run: uv run python -m pytest -q

  migrations:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: my_web
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Assert a single migration head
        working-directory: backend
        env:
          JWT_SECRET_KEY: test-only-secret-key-not-for-production
          DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/my_web"
          LLM_MODEL: test-default-model
        shell: bash
        run: |
          set -euo pipefail
          test "$(uv run alembic heads | grep -c .)" -eq 1

      - name: Upgrade a fresh MySQL database
        working-directory: backend
        env:
          JWT_SECRET_KEY: test-only-secret-key-not-for-production
          DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/my_web"
          LLM_MODEL: test-default-model
        run: uv run alembic upgrade head

  # Aggregate release gate. Keeps the existing Branch Protection required
  # `quality` check meaningful: it passes only when frontend, backend, and
  # migrations all pass, and fails (never silently skips) on any failure.
  quality:
    runs-on: ubuntu-latest
    needs: [frontend, backend, migrations]
    if: always()

    steps:
      - name: Verify all required gates passed
        run: |
          set -euo pipefail
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.migrations.result }}" = "success"
          echo "All required checks passed (frontend, backend, migrations)."
